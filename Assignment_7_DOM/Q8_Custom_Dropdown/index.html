<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown without select</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<section class="app"><h1>Custom Dropdown</h1><div id="dropdown" class="dropdown"><button id="dropdownToggle" aria-expanded="false">Choose a branch</button><div id="dropdownOptions" class="dropdown-options" hidden><button type="button">Computer Science</button><button type="button">Information Technology</button><button type="button">Electronics</button><button type="button">Mechanical</button></div></div><p id="chosenOption">No option selected.</p></section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Step Form</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<section class="app"><h1>Registration Form</h1><form id="stepsForm" novalidate><div class="step active" data-step="0"><label>Name <input id="userName" type="text" autocomplete="name"></label></div><div class="step" data-step="1"><label>Email <input id="userEmail" type="email" autocomplete="email"></label></div><div class="step" data-step="2"><label>Password <input id="userPassword" type="password" autocomplete="new-password"></label></div><p id="stepError" class="error"></p><div class="controls"><button type="button" id="backButton">Back</button><button type="button" id="nextButton">Next</button></div></form><div id="summary" hidden></div></section>
</body>
</html>

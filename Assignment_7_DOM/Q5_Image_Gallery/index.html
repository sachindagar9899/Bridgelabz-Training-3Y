<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery with Modal</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<section class="app"><h1>Image Gallery</h1><div id="gallery" class="gallery"><img src="https://picsum.photos/id/1015/300/200" alt="Mountain landscape"><img src="https://picsum.photos/id/1025/300/200" alt="Dog portrait"><img src="https://picsum.photos/id/1035/300/200" alt="Forest"><img src="https://picsum.photos/id/1043/300/200" alt="Ocean"><img src="https://picsum.photos/id/106/300/200" alt="River"><img src="https://picsum.photos/id/1074/300/200" alt="Wildlife"></div></section><div id="imageModal" class="modal" hidden><div class="modal-content"><button id="closeModal" class="close-btn">×</button><img id="largeImage" alt="Large preview"></div></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
<section class="app"><h1>Theme Switcher</h1><p>Choose a theme to change this page.</p><div class="controls"><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button><button data-theme-choice="blue">Blue</button></div><p>Saved theme: <strong id="savedTheme">light</strong></p></section>
</body>
</html>

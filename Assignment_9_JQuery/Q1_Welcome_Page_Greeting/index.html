<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Page Greeting</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <script src="script.js" defer></script>
</head>
<body>
<main class="container">
  <h1 id="greeting">Welcome!</h1>
  <p id="welcomeMessage">We are happy to have you here. Explore and enjoy your visit.</p>
  <div class="controls">
    <button id="changeGreeting">Change Greeting</button>
    <button id="toggleWelcome">Hide Welcome Message</button>
  </div>
  <p class="hint">Click the greeting heading to see an alert.</p>
</main>
</body>
</html>

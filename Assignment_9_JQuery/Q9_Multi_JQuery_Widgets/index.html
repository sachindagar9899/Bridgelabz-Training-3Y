<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-jQuery Widgets</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script>window.jQueryV1 = window.jQuery.noConflict(true);</script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script>window.jQueryV2 = window.jQuery.noConflict(true);</script>
  
  <script src="script.js" defer></script>
</head>
<body>
<main class="container">
  <h1>Dashboard: Multiple jQuery Versions</h1>
  <section class="widget active-widget">
    <h2>Carousel Widget</h2><p id="carouselText">Slide 1: Welcome to the dashboard.</p>
    <div class="controls"><button id="previousSlide">Previous</button><button id="nextSlide">Next</button></div>
  </section>
  <section class="widget">
    <h2>Notification Widget</h2><button id="openModal">Open Notification</button>
    <button class="tooltip-button" title="This tooltip is managed by jQuery version 2">Hover for tooltip</button>
  </section>
  <div id="notificationModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-content"><h2 id="modalTitle">Notification</h2><p>You have successfully opened the dashboard notification.</p><button id="closeModal">Close</button></div>
  </div>
  <p id="versionInfo" class="hint"></p>
</main>
</body>
</html>

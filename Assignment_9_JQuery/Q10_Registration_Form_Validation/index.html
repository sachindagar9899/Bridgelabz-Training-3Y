<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form Validation</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  
  <script src="script.js" defer></script>
</head>
<body>
<main class="container">
  <h1>Registration Form</h1>
  <form id="registrationForm" novalidate>
    <label for="regName">Name</label><input id="regName" type="text" placeholder="Enter your name"><small id="nameError" class="error"></small>
    <label for="regEmail">Email</label><input id="regEmail" type="email" placeholder="Enter your email"><small id="emailError" class="error"></small>
    <label for="regPassword">Password</label><input id="regPassword" type="password" placeholder="At least 8 characters"><small id="passwordError" class="error"></small>
    <button type="submit">Register</button>
  </form>
  <p id="registrationSuccess" class="success" hidden>Registration successful!</p>
</main>
</body>
</html>

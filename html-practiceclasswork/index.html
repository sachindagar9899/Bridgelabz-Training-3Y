<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">

        <div class="image-box">
            <img src="product.jpeg" alt="Men Geometric Print Regular Fit Short Kurta">
            <span class="bestseller">BESTSELLER</span>
        </div>

        <div class="product-info">

            <h3>SHOOLIN</h3>

            <p class="title">
                Men Geometric Print Regular Fit Short Kurta
            </p>

            <div class="rating">
                <span>2.9 ★</span>
                <span class="reviews">24</span>
            </div>

            <div class="price">
                <strong>₹340</strong>
                <del>₹1,999</del>
                <span>(83% off)</span>
            </div>

            <div class="offer">
                <span class="offer-icon">%</span>
                Offer Price: ₹306
            </div>

        </div>

    </div>

</body>
</html>

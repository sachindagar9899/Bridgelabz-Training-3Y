<html>
<head>
    <title>mydashboard</title>
        <style>
            :root{
                --bg-main: #e7eaf2;
                --bg-sidebar:#12151e;
                --bg-sidebar-hover:#1b202e;
                --bg-sidebar-active:#202637;

                --accent-primary: #6366f1;
                --accent-glow:rgba(99,102,241,0.25);

                --text-main: #f1f5f9;
                --text-muted: #8e9bb2;
                --text-dim: #5a667d;

                --border-color: #1e2433;
                --border-subtle: #293044;
                ---ac: black;
                --sidebar-width: 270px;

                -o-transition-speed: 0.3s;
            }
            *{
                margin: 0;
                padding: 0;
            }
            body {
                min-height: 100vh;
                background-color: var(--bg-main);
                font-family: Arial, Helvetica, sans-serif;
                color: var(--text-main);
                background-color: whitesmoke;
            }
            .container {
                   display: flex;
                   min-height: 100vh;
            }
            .sidebar {
                width: var(--sidebar-width);
                min-height: 100vh;
                background-color: var(--bg-sidebar);
                border-right: 0.6px solid  var(--border-color);
                display: flex;
                flex-direction: column;
                padding: 18px 14px;
            }
            .sidebar-header {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px 8px 20px;
                border-bottom: 1px solid var(--border-color);
            }

        </style>
        <body>
            <div class="container">
                <aside class="sidebar">
                    <div class="sidebar-headeer">
                        <div class="sidebar-icon"> A</div>
                        <div class="brand-info">
                            <span class="brand-name"> ApexCore</span>
                            <span class="Brand-plan"> Pro Platform</span>
                        </div>
                    </div>
                    <div class="sidebar-menu"></div>
            </div>
            <div class="container">
                <aside class="sidebar"></aside>
                <main class="main-container"></main>
                <h1>DAshboard</h1>
                </div>
        </body>
</head>
</html>

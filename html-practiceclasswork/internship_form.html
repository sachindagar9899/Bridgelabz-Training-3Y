<!DOCTYPE html>
<html lang="en">
<head>
  <title> my page</title>
        <link rel="stylesheet" href="css/css2.css">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internship Application Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: auto; }
    fieldset { margin-bottom: 15px; padding: 12px; }
    label { display: block; margin-bottom: 6px; }
    .inline { display: inline-block; margin-right: 12px; }
    input[type="text"], input[type="email"], input[type="tel"], input[type="date"], input[type="password"], select, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
    textarea { min-height: 120px; }
    .buttons { margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Internship Application Form</h1>

  <form action="#" method="post" enctype="multipart/form-data">

    <fieldset>
      <legend>Personal Details</legend>

      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" placeholder="e.g. Jane Doe" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="e.g. +1-555-555-5555" required>

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" name="dob" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Create a password" required>

      <label>Gender</label>
      <label class="inline"><input type="radio" id="gender_m" name="gender" value="Male" required> <span for="gender_m">Male</span></label>
      <label class="inline"><input type="radio" id="gender_f" name="gender" value="Female"> <span for="gender_f">Female</span></label>
      <label class="inline"><input type="radio" id="gender_o" name="gender" value="Other"> <span for="gender_o">Other</span></label>

    </fieldset>

    <fieldset>
      <legend>Education & Course</legend>

      <label for="course">Course</label>
      <select id="course" name="course" required>
        <option value="" disabled selected>Select your course</option>
        <option value="CSE">CSE</option>
        <option value="IT">IT</option>
        <option value="ECE">ECE</option>
        <option value="Mechanical">Mechanical</option>
      </select>

      <label>Skills (select all that apply)</label>
      <label class="inline"><input type="checkbox" id="skill_java" name="skills[]" value="Java"> <span for="skill_java">Java</span></label>
      <label class="inline"><input type="checkbox" id="skill_js" name="skills[]" value="JavaScript"> <span for="skill_js">JavaScript</span></label>
      <label class="inline"><input type="checkbox" id="skill_html" name="skills[]" value="HTML"> <span for="skill_html">HTML</span></label>
      <label class="inline"><input type="checkbox" id="skill_css" name="skills[]" value="CSS"> <span for="skill_css">CSS</span></label>
      <label class="inline"><input type="checkbox" id="skill_react" name="skills[]" value="React"> <span for="skill_react">React</span></label>

    </fieldset>

    <fieldset>
      <legend>Internship Details</legend>

      <label>Internship Preference</label>
      <label class="inline"><input type="radio" id="pref_onsite" name="preference" value="Onsite" required> <span for="pref_onsite">Onsite</span></label>
      <label class="inline"><input type="radio" id="pref_remote" name="preference" value="Remote"> <span for="pref_remote">Remote</span></label>
      <label class="inline"><input type="radio" id="pref_hybrid" name="preference" value="Hybrid"> <span for="pref_hybrid">Hybrid</span></label>

      <label for="resume">Upload Resume</label>
      <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>

      <label for="coverLetter">Cover Letter</label>
      <textarea id="coverLetter" name="coverLetter" placeholder="Write a short cover letter..." required></textarea>

    </fieldset>

    <div class="buttons">
      <button type="submit">Submit Application</button>
      <button type="reset">Reset Form</button>
    </div>

  </form>

</body>
</html>

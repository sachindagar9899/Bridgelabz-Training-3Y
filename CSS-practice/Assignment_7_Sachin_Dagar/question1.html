<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Navigation Bar | Sachin Dagar</title><link rel="stylesheet" href="question1.css">  <style>
* { box-sizing: border-box; scroll-behavior: smooth; }
body { margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #172033; }
header { text-align: center; padding: 25px; }
.navbar { display: flex; justify-content: center; gap: 8px; padding: 12px; background: #0f172a; }
.navbar a { padding: 12px 20px; border: 1px solid #475569; border-radius: 8px; color: white; text-decoration: none; transition: all 0.3s ease; }
.navbar a:hover { background: #334155; transform: translateY(-2px); }
.navbar a.active { background: #2563eb; border-color: #60a5fa; }
main { min-height: 55vh; }
main section { width: min(750px, 90%); margin: 25px auto; padding: 35px; background: white; border-radius: 18px; text-align: center; }
footer { text-align: center; padding: 20px; }
@media (max-width: 700px) {
  .navbar { flex-direction: column; align-items: stretch; }
  .navbar a { text-align: center; }
}
.student-badge {
  width: fit-content;
  margin: 10px auto 0;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(37, 99, 235, 0.10);
  color: #1d4ed8;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: .3px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.student-badge:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 20px rgba(37, 99, 235, .15);
}

  </style>
</head>
<body>
<header><h1>Modern Navigation</h1></header>
<nav class="navbar" aria-label="Main navigation">
  <a class="active" href="#home">Home</a><a href="#about">About</a><a href="#services">Services</a><a href="#projects">Projects</a><a href="#contact">Contact</a>
</nav>
<main>
<section id="home"><h2>Welcome</h2><p>Responsive navigation with smooth hover transitions.</p></section>
<section id="about"><h2>About</h2><p>A clean CSS-only navigation example.</p></section>
</main>
<div class="student-badge">✨ Designed & Coded by Sachin Dagar</div>
  <footer>Created by Sachin Dagar • Assignment 7</footer>
</body>
</html>

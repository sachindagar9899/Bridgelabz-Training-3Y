<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Advanced Selectors | Sachin Dagar</title><link rel="stylesheet" href="question6.css">  <style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #eef2ff; color: #172033; }
header, footer { text-align: center; padding: 24px; }
.panel { width: min(760px, 92%); margin: 20px auto; padding: 30px; background: white; border-radius: 20px; box-shadow: 0 12px 30px rgba(15,23,42,.12); }
.items { padding: 0; list-style: none; }
.items > li { padding: 12px; border-bottom: 1px solid #ddd; } /* child combinator */
.items li:nth-child(odd) { background: #f1f5f9; } /* pseudo-class */
.items li:hover { background: #dbeafe; } /* hover pseudo-class */
.links a[href^="https"] { font-weight: bold; } /* attribute selector */
input[type="text"] { border: 2px solid #2563eb; } /* attribute selector */
input:focus { outline: 3px solid #bfdbfe; } /* focus pseudo-class */
.panel > h2::before { content: "★ "; } /* child + pseudo-element */
.links a + a { margin-left: 20px; } /* adjacent sibling */
.note::after { content: " ✓"; font-weight: bold; } /* pseudo-element */
.panel h2 { letter-spacing: 1px; } /* descendant combinator */
.items li:first-child ~ li { color: #334155; } /* general sibling */ 
label { display: block; margin: 15px 0; }
input { padding: 10px; border-radius: 8px; }
.student-badge {
  width: fit-content;
  margin: 10px auto 0;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(37, 99, 235, 0.10);
  color: #1d4ed8;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: .3px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.student-badge:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 20px rgba(37, 99, 235, .15);
}

  </style>
</head>
<body>
<header><h1>Advanced CSS Selectors</h1></header>
<main>
  <section class="panel">
    <h2>Selector Playground</h2>
    <ul class="items">
      <li>First item</li><li>Second item</li><li>Third item</li><li>Fourth item</li>
    </ul>
    <div class="links"><a href="https://example.com">Secure link</a><a href="/local">Local link</a></div>
    <form>
      <label>Name <input type="text" placeholder="Type your name"></label>
      <label>Age <input type="number" placeholder="Age"></label>
    </form>
    <p class="note">Hover, focus and list selectors are demonstrated here.</p>
  </section>
</main>
<div class="student-badge">✨ Designed & Coded by Sachin Dagar</div>
  <footer>Created by Sachin Dagar • Assignment 7</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Outline Form | Sachin Dagar</title><link rel="stylesheet" href="question10.css">  <style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #eef2ff; color: #172033; }
header, footer { text-align: center; padding: 24px; }
.contact-form { width: min(480px, 92%); margin: 25px auto; padding: 30px; background: white; border-radius: 18px; box-shadow: 0 12px 30px rgba(15,23,42,.12); }
label { display: block; margin: 15px 0 7px; font-weight: bold; }
input, textarea { width: 100%; padding: 12px; border: 1px solid #94a3b8; border-radius: 9px; box-shadow: 0 3px 8px rgba(15,23,42,.08); font: inherit; }
input:focus, textarea:focus { outline: 3px solid #93c5fd; outline-offset: 4px; border-color: #2563eb; }
textarea { resize: vertical; }
button { margin-top: 20px; padding: 12px 24px; border: 2px solid #1d4ed8; border-radius: 9px; background: #2563eb; color: white; cursor: pointer; transition: all .2s ease; }
button:hover { outline: 2px dashed #1e3a8a; outline-offset: 3px; }
.student-badge {
  width: fit-content;
  margin: 10px auto 0;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(37, 99, 235, 0.10);
  color: #1d4ed8;
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: .3px;
  transition: transform .25s ease, box-shadow .25s ease;
}
.student-badge:hover {
  transform: translateY(-2px) scale(1.02);
  box-shadow: 0 8px 20px rgba(37, 99, 235, .15);
}

  </style>
</head>
<body>
<header><h1>Outline & Focus Styling</h1></header>
<main>
<form class="contact-form">
  <label for="name">Name</label><input id="name" type="text" placeholder="Enter your name">
  <label for="email">Email</label><input id="email" type="email" placeholder="Enter your email">
  <label for="message">Message</label><textarea id="message" rows="5" placeholder="Write your message"></textarea>
  <button type="submit">Submit</button>
</form>
</main>
<div class="student-badge">✨ Designed & Coded by Sachin Dagar</div>
  <footer>Created by Sachin Dagar • Assignment 7</footer>
</body>
</html>

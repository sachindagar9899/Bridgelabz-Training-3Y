<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>UI Components</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:linear-gradient(135deg,#dbeafe,#f5d0fe);display:flex;align-items:center;justify-content:center}
.card{background:white;width:min(700px,92%);padding:35px;border-radius:18px;box-shadow:0 12px 30px #0003}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input,select,button{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}input{flex:1;min-width:180px}
button{background:#4f46e5;color:white;border:0;cursor:pointer}button:hover{background:#3730a3}input:focus,select:focus,button:focus{outline:3px solid #c4b5fd}
</style></head>
<body><main class="card"><h1>User Interface Components</h1><div class="controls">
<input type="search" placeholder="Search here..."><button>Search</button><select><option>Choose Category</option><option>Technology</option><option>Education</option><option>Design</option></select><button>Submit</button>
</div></main></body></html>

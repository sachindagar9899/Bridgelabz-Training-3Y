<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mini User Interface</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#e2e8f0;display:flex;flex-direction:column}
header,footer{background:#0f172a;color:white;text-align:center;padding:18px}main{flex:1;display:flex;align-items:center;justify-content:center;padding:30px}
.card{display:flex;gap:30px;align-items:center;background:white;padding:28px;border-radius:16px;box-shadow:0 10px 25px #0003;width:min(760px,95%)}.card img{width:220px;height:180px;object-fit:cover;border-radius:12px}
form{flex:1;display:flex;flex-direction:column;gap:12px}input,textarea,button{padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{resize:vertical}button{background:#2563eb;color:white;border:0;cursor:pointer;transition:.2s}button:hover{background:#1d4ed8;transform:translateY(-2px)}input:focus,textarea:focus{outline:3px solid #bfdbfe;border-color:#2563eb}
@media(max-width:700px){.card{flex-direction:column}.card img{width:100%;height:220px}}
</style></head>
<body><header><h1>Mini User Interface</h1></header>
<main><section class="card"><img src="https://picsum.photos/id/1/500/400" alt="Workspace">
<form><h2>Contact Form</h2><input type="text" placeholder="Your Name" required><input type="email" placeholder="Email Address" required><textarea rows="4" placeholder="Your Message"></textarea><button type="submit">Send Message</button></form>
</section></main><footer>© 2026 Mini UI • Assignment 8</footer></body></html>

<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Combined Effects</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#eef2ff;display:flex;align-items:center;justify-content:center}.examples{display:flex;gap:25px;justify-content:center;flex-wrap:wrap}
.effect{padding:18px 30px;border:0;border-radius:10px;background:#4f46e5;color:white;font-size:16px;cursor:pointer;box-shadow:0 4px 10px #0002;transition:transform .3s ease,background .3s ease,box-shadow .3s ease}
.effect:hover{transform:scale(1.1);background:#db2777;box-shadow:0 10px 22px #0003}.effect:active{transform:scale(.95)}.effect:focus{outline:3px solid #f59e0b}
</style></head>
<body><main><h1>Combined CSS Effects</h1><section class="examples"><button class="effect">Hover Me</button><button class="effect">Grow & Change</button><button class="effect">Click Me</button></section></main></body></html>

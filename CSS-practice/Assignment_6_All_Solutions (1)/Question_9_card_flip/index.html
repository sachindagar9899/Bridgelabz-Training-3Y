<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Flip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="scene">
    <div class="card">
      <div class="side front">
        <h1>Cybersecurity</h1>
        <img src="https://picsum.photos/300/180?random=10" alt="Cybersecurity">
      </div>
      <div class="side back">
        <h2>About</h2>
        <p>Cybersecurity protects computers, networks and data from cyber threats.</p>
      </div>
    </div>
  </div>
</body>
</html>

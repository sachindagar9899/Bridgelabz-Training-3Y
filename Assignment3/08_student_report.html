<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>
    <h1 title="School Name">Saraswati Senior Secondary School</h1>
    <h2>Student Report Card</h2>

    <!-- Marks table -->
    <table border="1">
        <tr>
            <th>Subject</th>
            <th>Maximum Marks</th>
            <th>Obtained Marks</th>
        </tr>
        <tr><td>English</td><td>100</td><td>82</td></tr>
        <tr><td>Mathematics</td><td>100</td><td>88</td></tr>
        <tr><td>Physics</td><td>100</td><td>79</td></tr>
        <tr><td>Chemistry</td><td>100</td><td>81</td></tr>
        <tr><td>Computer Science</td><td>100</td><td>90</td></tr>
        <tr>
            <td colspan="2" title="Total marks obtained">Total</td>
            <td>420 / 500</td>
        </tr>
        <tr>
            <td rowspan="2" title="Final Result">Result</td>
            <td>Percentage</td>
            <td>84%</td>
        </tr>
        <tr>
            <td>Grade</td>
            <td>A</td>
        </tr>
    </table>
</body>
</html>

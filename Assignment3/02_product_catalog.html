<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
</head>
<body>
    <h1>Online Store - Product Catalog</h1>

    <!-- Product table -->
    <table border="1">
        <tr>
            <th>Product Name</th>
            <th>Image</th>
            <th>Description</th>
            <th>Price</th>
            <th>Availability</th>
        </tr>
        <tr>
            <td rowspan="2">Laptop</td>
            <td><img src="https://via.placeholder.com/120" alt="Laptop"></td>
            <td>Powerful laptop for study and work.</td>
            <td>₹55,000</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td><img src="https://via.placeholder.com/120" alt="Laptop accessory"></td>
            <td>Premium laptop accessory bundle.</td>
            <td>₹5,000</td>
            <td>In Stock</td>
        </tr>
        <tr>
            <td>Headphones</td>
            <td><img src="https://via.placeholder.com/120" alt="Headphones"></td>
            <td>Wireless headphones with clear sound.</td>
            <td>₹2,500</td>
            <td>Available</td>
        </tr>
        <tr>
            <td colspan="4">Special Offer</td>
            <td>10% Off</td>
        </tr>
    </table>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Selection Page</title>
</head>
<body>
    <h1>Travel Selection</h1>

    <!-- Country selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>USA</option>
        <option>Canada</option>
    </select>
    <br><br>

    <!-- State selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Haryana</option>
        <option>Rajasthan</option>
    </select>
    <br><br>

    <!-- City selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Mathura</option>
        <option>Agra</option>
        <option>Jaipur</option>
    </select>
    <br><br>

    <!-- Tourist place selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Vrindavan</option>
        <option>Amber Fort</option>
    </select>

    <p>My choices are: India, Uttar Pradesh, Mathura, and Taj Mahal.</p>
</body>
</html>
